name: Tic-Tac-Toe

on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  play:
    if: startsWith(github.event.issue.title, 'tictactoe|')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Play the move
        env:
          REPO: ${{ github.repository }}
          ISSUE_NUMBER: ${{ github.event.issue.number }}
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python3 .github/tictactoe.py
